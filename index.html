<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Razas de Perros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Buscador de Perritos</h1>
        <p>Escribe la raza que a consultar:</p>

        <div class="search-box">
            <input type="text" id="input-search" placeholder="Ej. Golden Retriever, Poodle...">
            <button id="btn-search">Buscar</button>
        </div>

        <div id="result-container" class="hidden">
            <div class="img-container">
                <img id="dog-img" src="" alt="Foto del perro">
            </div>
            
            <div class="details">
                <h2 id="dog-name">Nombre de la raza</h2>
                <p><strong>Personalidad:</strong> <span id="dog-temperament">-</span></p>
                <p><strong>Esperanza de vida:</strong> <span id="dog-life">-</span></p>
                <p><strong>Origen:</strong> <span id="dog-origin">-</span></p>
            </div>
        </div>

        <p id="error-msg" class="error hidden">No encontramos esa raza, intenta con otra.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
