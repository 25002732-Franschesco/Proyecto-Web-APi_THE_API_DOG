<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/sesion.css">
</head>
<body>

    <div class="card">
        <h1>Crear Cuenta</h1>
        <p>Registra un nuevo usuario:</p>

        <form onsubmit="registrarUsuario(event)">
            <div class="search-box">
                <input type="text" id="regUser" placeholder="Usuario" required>
            </div>
            <div class="search-box">
                <input type="password" id="regPass" placeholder="Contraseña" required>
            </div>
            <div class="search-box">
                 <select id="regRol" style="flex: 1; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--mentita); background: white; color: var(--azul-oscuro); font-size: 13px;">
                    <option value="cliente">cliente</option>
                    <option value="boss">boss</option>
                    <option value="admin">admin</option>
                </select>
            </div>
            <button type="submit" style="width: 100%;">Registrarme</button>
        </form>

        <p style="margin-top: 15px; font-size: 13px;">
            ¿Ya tienes cuenta? <a href="./html/sesion.html" style="color: var(--mentolado); font-weight: 600;">Iniciar sesión</a>
        </p>
    </div>

    <script src="./js/registro.js"></script>
</body>
</html>
