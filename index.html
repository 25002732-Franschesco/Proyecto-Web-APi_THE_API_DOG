<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/sesion.css">
</head>
<body>
    <div class="card">
        <h1>Registro</h1>
        <p>Crea tu cuenta:</p>

        <form onsubmit="registrar(event)">
            <div class="fila">
                <input type="text" id="usuarioReg" placeholder="Usuario" required>
            </div>
            <div class="fila">
                <input type="password" id="claveReg" placeholder="Contraseña" required>
            </div>
            <div class="fila">
                <select id="rolReg">
                    <option value="cliente">cliente</option>
                    <option value="admin">admin</option>
                    <option value="boss">boss</option>
                </select>
            </div>
            <button type="submit" class="ancho-full">Registrarme</button>
        </form>

        <p class="enlace-texto">¿Ya tienes cuenta? <a href="./html/sesion.html">Inicia sesión</a></p>
    </div>

    <script src="./js/registro.js"></script>
</body>
</html>
