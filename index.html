<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/sesion.css">
</head>
<body>
    <main class="card">
        <h1>Registro</h1>
        <p>Crea tu cuenta:</p>

        <form onsubmit="registrar(event)">
            <div class="fila">
                <label for="usuarioReg" class="visually-hidden">Usuario</label>
                <input type="text" id="usuarioReg" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="fila">
                <label for="claveReg" class="visually-hidden">Contraseña</label>
                <input type="password" id="claveReg" class="form-control" placeholder="Contraseña" required>
            </div>
            <div class="fila">
                <label for="rolReg" class="visually-hidden">Rol</label>
                <select id="rolReg" class="form-select">
                    <option value="cliente">cliente</option>
                    <option value="admin">admin</option>
                    <option value="boss">boss</option>
                </select>
            </div>
            <button type="submit" class="btn ancho-full">Registrarme</button>
        </form>

        <p class="enlace-texto">¿Ya tienes cuenta? <a href="./html/sesion.html">Inicia sesión</a></p>
    </main>

    <script src="./js/registro.js"></script>
</body>
</html>
