<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perritos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="cargarDatosUsuario()">
    <div class="card">
        <h1 id="titulo">Perritos</h1>
        <p id="infoUsuario">Usuario:</p>

        <div class="fila">
            <input type="text" id="textoBuscar" placeholder="Ej. Poodle, Husky...">
            <button id="btnBuscar">Buscar</button>
            <button id="btnAleatorio" class="ocultar">Aleatorio</button>
        </div>

        <div id="cajaBotonPeso" class="fila ocultar">
            <button id="btnPeso" class="ancho-full">Ver tabla de peso</button>
        </div>

        <div id="resultado" class="ocultar">
            <div id="fotoSola" class="caja-foto">
                <img id="imgPerro" src="" alt="Perro">
            </div>

            <div id="fotosVarias" class="cuadricula ocultar"></div>

            <div class="caja-datos">
                <h2 id="nombrePerro">Raza</h2>
                <p><b>Personalidad:</b> <span id="personalidadPerro">-</span></p>
                <p><b>Vida:</b> <span id="vidaPerro">-</span></p>
                <p><b>Origen:</b> <span id="origenPerro">-</span></p>
            </div>
        </div>

        <div id="cajaPeso" class="ocultar">
            <table>
                <thead>
                    <tr>
                        <th>Raza</th>
                        <th>Peso (kg)</th>
                        <th>Tamaño</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaPeso"></tbody>
            </table>
            <p id="consejo" class="caja-datos ocultar"></p>
        </div>

        <p id="errorPerro" class="error ocultar">No se encontró esa raza.</p>

        <button onclick="salir()" class="ancho-full btn-oscuro">Cerrar sesión</button>
    </div>

    <script src="../js/login.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
