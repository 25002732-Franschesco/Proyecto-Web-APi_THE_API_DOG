<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sesion.css">
</head>
<body>

    <div class="card">
        <h1>Iniciar Sesión</h1>
        <p>Ingresa con tu cuenta:</p>

        <form onsubmit="iniciarSesion(event)">
            <div class="search-box">
                <input type="text" id="inputUser" placeholder="Usuario" required>
            </div>
            <div class="search-box">
                <input type="password" id="inputPass" placeholder="Contraseña" required>
            </div>
            <button type="submit" style="width: 100%;">Entrar</button>
        </form>

        <p id="errorMsg" class="error hidden">Usuario o contraseña incorrectos.</p>

        <p style="margin-top: 15px; font-size: 13px;">
            ¿No tienes cuenta? <a href="../index.html" style="color: var(--mentolado); font-weight: 600;">Regístrate aquí</a>
        </p>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
