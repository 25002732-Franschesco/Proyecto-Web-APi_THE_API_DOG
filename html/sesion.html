<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sesion.css">
</head>
<body>
    <div class="card">
        <h1>Iniciar Sesión</h1>
        <p>Entra con tu usuario:</p>

        <form onsubmit="entrar(event)">
            <div class="fila">
                <input type="text" id="usuarioLogin" placeholder="Usuario" required>
            </div>
            <div class="fila">
                <input type="password" id="claveLogin" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="ancho-full">Entrar</button>
        </form>

        <p id="mensajeError" class="error ocultar">Usuario o contraseña mal.</p>

        <p class="enlace-texto">¿No tienes cuenta? <a href="../index.html">Regístrate</a></p>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
