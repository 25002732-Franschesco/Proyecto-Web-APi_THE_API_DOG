<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sesion.css">
</head>
<body>
    <main class="card">
        <h1>Iniciar Sesión</h1>
        <p>Entra con tu cuenta:</p>

        <form onsubmit="entrar(event)">
            <div class="fila">
                <label for="usuarioLogin" class="visually-hidden">Usuario</label>
                <input type="text" id="usuarioLogin" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="fila">
                <label for="claveLogin" class="visually-hidden">Contraseña</label>
                <input type="password" id="claveLogin" class="form-control" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn ancho-full">Entrar</button>
        </form>

        <p id="mensajeError" class="error ocultar" role="alert">Usuario o contraseña incorrectos.</p>

        <p class="enlace-texto">¿No tienes cuenta? <a href="../index.html">Regístrate</a></p>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
